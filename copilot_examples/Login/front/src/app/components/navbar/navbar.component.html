<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" (click)="goToGallery()" style="cursor: pointer;">
      📸 Image Gallery
    </a>
    
    <div class="navbar-nav ms-auto">
      <!-- Cart Button -->
      <button *ngIf="isAuthenticated" class="btn btn-outline-primary me-2" type="button">
        🛒 Cart ({{ cartItemCount }})
      </button>
      
      <!-- Authentication Buttons -->
      <button *ngIf="!isAuthenticated" class="btn btn-outline-success me-2" type="button" (click)="goToLogin()">
        Login
      </button>
      
      <button *ngIf="isAuthenticated" class="btn btn-outline-danger" type="button" (click)="logout()">
        Logout
      </button>
    </div>
  </div>
</nav>
